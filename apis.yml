description: 'Cullgen Inc. is a clinical-stage biopharmaceutical company headquartered in San Diego,
  California, founded in 2018 and focused on first-in-class targeted protein degradation medicines. Its
  proprietary uSMITE (ubiquitin-mediated, small molecule-induced target elimination) platform harnesses
  the body''s own ubiquitin-proteasome system to selectively degrade disease-causing intracellular
  proteins, including targets considered undruggable by conventional small molecules, and the company
  extends that chemistry into degrader-antibody conjugates (DACs). Its lead TRK degrader program has
  entered Phase 1 clinical dosing, and the company has partnered with Astellas and taken investment from
  AstraZeneca. Gyre Therapeutics completed an all-stock acquisition of Cullgen valued at approximately
  $300 million on 4 May 2026. Cullgen publishes a corporate marketing website only: profiling on
  2026-08-04 found no developer portal, documentation, machine-readable API contract, package registry
  presence, or public code repositories.'
